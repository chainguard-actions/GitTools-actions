name: Test invalid GitVersion argument fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Install GitVersion binary (stands in for gitversion/setup)
        run: |
          set -e
          VER=6.3.0
          DIR="$RUNNER_TEMP/gitversion-tool"
          mkdir -p "$DIR"
          curl -fsSL "https://github.com/GitTools/GitVersion/releases/download/${VER}/gitversion-linux-x64-${VER}.tar.gz" -o "$RUNNER_TEMP/gv.tar.gz"
          tar -xzf "$RUNNER_TEMP/gv.tar.gz" -C "$DIR"
          chmod +x "$DIR/gitversion"
          cp "$DIR/gitversion" "$DIR/dotnet-gitversion"
          echo "$DIR" >> "$GITHUB_PATH"
          echo "GITVERSION_PATH=$DIR" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        with:
          disableShallowCloneCheck: "true"
          arguments: /showvariable ThisVariableDoesNotExist
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for an invalid variable"
            exit 1
          fi
          echo "PASS"
