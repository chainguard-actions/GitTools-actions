name: Test targetPath pointing at a tagged repository
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Install GitVersion binary and dotnet shim (stands in for gitversion/setup)
        run: |
          set -e
          VER=6.3.0
          DIR="$RUNNER_TEMP/gitversion-tool"
          SHIM="$RUNNER_TEMP/dotnet-shim"
          mkdir -p "$DIR" "$SHIM"
          curl -fsSL "https://github.com/GitTools/GitVersion/releases/download/${VER}/gitversion-linux-x64-${VER}.tar.gz" -o "$RUNNER_TEMP/gv.tar.gz"
          tar -xzf "$RUNNER_TEMP/gv.tar.gz" -C "$DIR"
          chmod +x "$DIR/gitversion"
          cp "$DIR/gitversion" "$DIR/dotnet-gitversion"
          # The action requires a 'dotnet' executable; provide a shim that
          # forwards tool invocations to the native gitversion binary.
          cat > "$SHIM/dotnet" <<EOF
          #!/bin/bash
          echo "dotnet \$*" >> "$RUNNER_TEMP/dotnet-calls.log"
          case "\$1" in
            --info|--version) echo "8.0.100"; exit 0 ;;
            --list-sdks) echo "8.0.100 [$SHIM/sdk]"; exit 0 ;;
            --list-runtimes) echo "Microsoft.NETCore.App 8.0.0 [$SHIM/shared/Microsoft.NETCore.App]"; exit 0 ;;
            tool|nuget|new|restore|build) echo "fake dotnet \$*"; exit 0 ;;
          esac
          args=()
          skip=0
          for a in "\$@"; do
            if [ \$skip = 1 ]; then skip=0; continue; fi
            case "\$a" in
              --roll-forward) skip=1 ;;
              --roll-forward=*|"--roll-forward Major") ;;
              *gitversion|*gitversion.dll|*gitversion.exe|*.dll) ;;
              *) args+=("\$a") ;;
            esac
          done
          exec "$DIR/gitversion" "\${args[@]}"
          EOF
          chmod +x "$SHIM/dotnet"
          echo "$SHIM" >> "$GITHUB_PATH"
          echo "$DIR" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$SHIM" >> "$GITHUB_ENV"
          echo "GITVERSION_PATH=$DIR" >> "$GITHUB_ENV"
      - name: Create a tagged repository
        run: |
          set -e
          REPO="$RUNNER_TEMP/tagged-repo"
          rm -rf "$REPO"
          mkdir -p "$REPO"
          cd "$REPO"
          # GitVersion reads the branch from the build environment
          # (refs/heads/act-harness under act), so use that branch name.
          git init -q -b act-harness
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo hello > README.md
          # Under act the build-server branch is 'act-harness', which GitVersion's
          # default config treats as an unknown, orphaned branch (no base versions).
          # Map it to the main branch config so the tag is used.
          cat > GitVersion.yml <<'YML'
          workflow: GitHubFlow/v1
          branches:
            main:
              regex: ^(master|main|act-harness)$
              label: ''
              is-main-branch: true
              source-branches: []
          YML
          cat GitVersion.yml
          git add README.md GitVersion.yml
          git commit -q -m "initial"
          git tag v1.2.3
          # GitVersion on a build server requires exactly one remote.
          BARE="$RUNNER_TEMP/tagged-repo-remote.git"
          rm -rf "$BARE"
          git init -q --bare "$BARE"
          git remote add origin "$BARE"
          git push -q origin act-harness
          git push -q origin --tags
          git fetch -q origin
          git branch -u origin/act-harness
          git remote -v
          git log --oneline --decorate
      - id: action
        uses: .
        with:
          targetPath: ${{ runner.temp }}/tagged-repo
          disableShallowCloneCheck: "true"
          arguments: /output file /outputfile ${{ runner.temp }}/tagged.json
      - name: Show dotnet shim calls
        if: always()
        run: cat "$RUNNER_TEMP/dotnet-calls.log" 2>/dev/null || echo "(no dotnet calls)"
      - name: Assert version derived from tag
        env:
          OUTFILE: ${{ runner.temp }}/tagged.json
        run: |
          if [ ! -s "$OUTFILE" ]; then
            echo "FAIL: $OUTFILE missing or empty"
            exit 1
          fi
          cat "$OUTFILE"
          SEMVER="$(grep -o '"SemVer": *"[^"]*"' "$OUTFILE" | sed 's/.*: *"\(.*\)"/\1/')"
          MMP="$(grep -o '"MajorMinorPatch": *"[^"]*"' "$OUTFILE" | sed 's/.*: *"\(.*\)"/\1/')"
          echo "SemVer: $SEMVER"
          echo "MajorMinorPatch: $MMP"
          if [ "$MMP" != "1.2.3" ]; then
            echo "FAIL: expected MajorMinorPatch 1.2.3 (derived from tag v1.2.3)"
            exit 1
          fi
          case "$SEMVER" in
            1.2.3*) ;;
            *) echo "FAIL: expected SemVer starting with 1.2.3"; exit 1 ;;
          esac
          echo "PASS"
