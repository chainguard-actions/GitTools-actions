name: Test command fails on shallow clone
on:
  workflow_dispatch:
env:
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install GitVersion standalone binary
        run: |
          set -e
          GV_VERSION=6.3.0
          GV_DIR="$RUNNER_TEMP/gitversion-tool"
          mkdir -p "$GV_DIR"
          curl -sSfL "https://github.com/GitTools/GitVersion/releases/download/${GV_VERSION}/gitversion-linux-x64-${GV_VERSION}.tar.gz" -o "$RUNNER_TEMP/gv.tar.gz"
          tar -xzf "$RUNNER_TEMP/gv.tar.gz" -C "$GV_DIR"
          chmod +x "$GV_DIR/gitversion"
          ln -sf "$GV_DIR/gitversion" "$GV_DIR/dotnet-gitversion"
          echo "GITVERSION_PATH=$GV_DIR" >> "$GITHUB_ENV"
          echo "$GV_DIR" >> "$GITHUB_PATH"
      - name: Create a shallow clone
        run: |
          set -e
          SRC="$RUNNER_TEMP/gv-src"
          rm -rf "$SRC" "$GITHUB_WORKSPACE/gv-shallow"
          mkdir -p "$SRC"
          cd "$SRC"
          git init -b main .
          git config user.email "test@example.com"
          git config user.name "Test User"
          for i in 1 2 3; do echo $i >> f.txt; git add f.txt; git commit -m "c$i"; done
          git clone --depth 1 "file://$SRC" "$GITHUB_WORKSPACE/gv-shallow"
          cd "$GITHUB_WORKSPACE/gv-shallow"
          echo "is shallow: $(git rev-parse --is-shallow-repository)"
      - id: action
        uses: .
        continue-on-error: true
        with:
          targetPath: ${{ github.workspace }}/gv-shallow
          disableShallowCloneCheck: "false"
          arguments: /output json
      - name: Assert action failed on shallow clone
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure on shallow clone"
            exit 1
          fi
          echo "PASS"
