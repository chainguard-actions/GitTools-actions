name: Test basic gitversion command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Ensure .NET SDK is available
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel 10.0 --install-dir "$HOME/.dotnet" \
            || bash /tmp/dotnet-install.sh --channel 9.0 --install-dir "$HOME/.dotnet"
          bash /tmp/dotnet-install.sh --channel 8.0 --runtime dotnet --install-dir "$HOME/.dotnet" || true
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
          echo "DOTNET_ROLL_FORWARD=Major" >> "$GITHUB_ENV"
          "$HOME/.dotnet/dotnet" --info | head -40
      - name: Install GitVersion
        uses: ./gitversion/setup
        with:
          versionSpec: '6.x'
      - id: action
        uses: .
        with:
          arguments: '/output file /outputfile ${{ runner.temp }}/gv-basic.json'
      - name: Assert output file contains version variables
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTFILE: ${{ runner.temp }}/gv-basic.json
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ ! -f "$OUTFILE" ]; then
            echo "FAIL: output file $OUTFILE not created"
            exit 1
          fi
          cat "$OUTFILE"
          if ! grep -q '"FullSemVer"' "$OUTFILE"; then
            echo "FAIL: FullSemVer missing from output"
            exit 1
          fi
          if ! grep -q '"Major"' "$OUTFILE"; then
            echo "FAIL: Major missing from output"
            exit 1
          fi
          echo "PASS"
