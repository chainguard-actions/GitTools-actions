name: Test shallow clone check fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install GitVersion binary as dotnet-gitversion
        run: |
          set -e
          dir="$RUNNER_TEMP/gitversion-tool"
          mkdir -p "$dir"
          curl -sSfL -o "$RUNNER_TEMP/gv.tar.gz" \
            https://github.com/GitTools/GitVersion/releases/download/6.3.0/gitversion-linux-x64-6.3.0.tar.gz
          tar -xzf "$RUNNER_TEMP/gv.tar.gz" -C "$dir"
          cp "$dir/gitversion" "$dir/dotnet-gitversion"
          chmod +x "$dir/gitversion" "$dir/dotnet-gitversion"
          echo "GITVERSION_PATH=$dir" >> "$GITHUB_ENV"
          echo "$dir" >> "$GITHUB_PATH"
      - name: Create a shallow clone fixture repository
        run: |
          set -e
          src="$RUNNER_TEMP/gv-src"
          rm -rf "$src" "$GITHUB_WORKSPACE/gv-shallow"
          mkdir -p "$src"
          cd "$src"
          git init -q -b main
          git config user.email "test@example.com"
          git config user.name "Test User"
          for i in 1 2 3; do echo $i > f$i.txt; git add .; git commit -q -m "c$i"; done
          git clone -q --depth 1 "file://$src" "$GITHUB_WORKSPACE/gv-shallow"
          test -f "$GITHUB_WORKSPACE/gv-shallow/.git/shallow"
      - id: action
        uses: .
        continue-on-error: true
        with:
          targetPath: gv-shallow
          arguments: /output file /outputfile ${{ github.workspace }}/gv-shallow-out.json
      - name: Assert action failed on shallow clone
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for shallow clone"
            exit 1
          fi
          if [ -f "$GITHUB_WORKSPACE/gv-shallow-out.json" ]; then
            echo "FAIL: output file should not exist"
            exit 1
          fi
          echo "PASS"
