name: Test setup fails for a nonexistent version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure .NET SDK is available
        run: |
          if command -v dotnet >/dev/null 2>&1 && dotnet --list-sdks | grep -qE '^(8|9|10)\.'; then
            echo "dotnet already present"; dotnet --list-sdks; exit 0
          fi
          curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel 8.0 --install-dir "$HOME/.dotnet"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          versionSpec: '99.99.99'
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for nonexistent version"
            exit 1
          fi
          echo "PASS"
