name: Test overrideConfig next-version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Install .NET SDK and GitVersion tool
        run: |
          set -e
          TMPD="${RUNNER_TEMP:-/tmp}"
          DOTNET_DIR="$HOME/.dotnet"
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o "$TMPD/dotnet-install.sh"
          bash "$TMPD/dotnet-install.sh" --channel 8.0 --install-dir "$DOTNET_DIR"
          export DOTNET_ROOT="$DOTNET_DIR"
          export PATH="$DOTNET_DIR:$PATH"
          DIR="$TMPD/gitversion-tool"
          dotnet tool install GitVersion.Tool --version 6.3.0 --tool-path "$DIR"
          "$DIR/dotnet-gitversion" /version
          echo "DOTNET_ROOT=$DOTNET_DIR" >> "$GITHUB_ENV"
          echo "GITVERSION_PATH=$DIR" >> "$GITHUB_ENV"
          echo "$DOTNET_DIR" >> "$GITHUB_PATH"
          echo "$DIR" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          overrideConfig: |
            next-version=99.0.0
      - name: Assert version comes from overrideConfig
        env:
          MAJOR: ${{ steps.action.outputs.major }}
          MINOR: ${{ steps.action.outputs.minor }}
          PATCH: ${{ steps.action.outputs.patch }}
          MMP: ${{ steps.action.outputs.majorMinorPatch }}
        run: |
          echo "major=$MAJOR minor=$MINOR patch=$PATCH mmp=$MMP"
          if [ "$MAJOR" != "99" ]; then
            echo "FAIL: expected major 99"
            exit 1
          fi
          if [ "$MMP" != "99.0.0" ]; then
            echo "FAIL: expected majorMinorPatch 99.0.0"
            exit 1
          fi
          echo "PASS"
