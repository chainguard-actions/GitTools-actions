name: Test overrideConfig next-version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install GitVersion CLI
        run: bash "$GITHUB_WORKSPACE/tests/fixtures/install-gitversion.sh"
      - name: Create a fresh untagged repo
        run: |
          rm -rf "$GITHUB_WORKSPACE/gv-repo"
          mkdir -p "$GITHUB_WORKSPACE/gv-repo"
          cd "$GITHUB_WORKSPACE/gv-repo"
          git init -b main
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo one > file.txt && git add file.txt && git commit -m "first"
      - id: action
        uses: .
        env:
          GITHUB_REF: refs/heads/main
        with:
          targetPath: gv-repo
          disableNormalization: 'true'
          overrideConfig: |
            next-version=3.0.0
      - name: Assert next-version override applied
        env:
          MAJOR: ${{ steps.action.outputs.major }}
          MINOR: ${{ steps.action.outputs.minor }}
          MMP: ${{ steps.action.outputs.majorMinorPatch }}
        run: |
          echo "major=$MAJOR minor=$MINOR mmp=$MMP"
          [ "$MAJOR" = "3" ] || { echo "FAIL: major expected 3"; exit 1; }
          [ "$MINOR" = "0" ] || { echo "FAIL: minor expected 0"; exit 1; }
          case "$MMP" in 3.0.*) ;; *) echo "FAIL: majorMinorPatch expected 3.0.x"; exit 1 ;; esac
          echo "PASS"
