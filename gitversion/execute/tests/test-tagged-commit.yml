name: Test tagged commit yields tag version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install GitVersion CLI
        run: bash "$GITHUB_WORKSPACE/tests/fixtures/install-gitversion.sh"
      - name: Create a fresh full-history repo with a tag on HEAD
        run: |
          rm -rf "$GITHUB_WORKSPACE/gv-repo"
          mkdir -p "$GITHUB_WORKSPACE/gv-repo"
          cd "$GITHUB_WORKSPACE/gv-repo"
          git init -b main
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo one > file.txt && git add file.txt && git commit -m "first"
          echo two > file.txt && git commit -am "second"
          git tag v1.2.3
          git rev-parse HEAD > ../gv-head-sha.txt
      - id: action
        uses: .
        env:
          GITHUB_REF: refs/heads/main
        with:
          targetPath: gv-repo
          disableNormalization: 'true'
      - name: Assert version outputs
        env:
          MAJOR: ${{ steps.action.outputs.major }}
          MINOR: ${{ steps.action.outputs.minor }}
          PATCH: ${{ steps.action.outputs.patch }}
          MMP: ${{ steps.action.outputs.majorMinorPatch }}
          SEMVER: ${{ steps.action.outputs.semVer }}
          SHA: ${{ steps.action.outputs.sha }}
          SHORTSHA: ${{ steps.action.outputs.shortSha }}
        run: |
          echo "major=$MAJOR minor=$MINOR patch=$PATCH mmp=$MMP semVer=$SEMVER sha=$SHA shortSha=$SHORTSHA"
          EXPECTED_SHA="$(cat "$GITHUB_WORKSPACE/gv-head-sha.txt")"
          [ "$MAJOR" = "1" ] || { echo "FAIL: major"; exit 1; }
          [ "$MINOR" = "2" ] || { echo "FAIL: minor"; exit 1; }
          [ "$PATCH" = "3" ] || { echo "FAIL: patch"; exit 1; }
          [ "$MMP" = "1.2.3" ] || { echo "FAIL: majorMinorPatch"; exit 1; }
          case "$SEMVER" in 1.2.3*) ;; *) echo "FAIL: semVer should start with 1.2.3"; exit 1 ;; esac
          [ "$SHA" = "$EXPECTED_SHA" ] || { echo "FAIL: sha expected $EXPECTED_SHA"; exit 1; }
          [ -n "$SHORTSHA" ] || { echo "FAIL: shortSha empty"; exit 1; }
          case "$EXPECTED_SHA" in "$SHORTSHA"*) ;; *) echo "FAIL: shortSha not a prefix of sha"; exit 1 ;; esac
          echo "PASS"
