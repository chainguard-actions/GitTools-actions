name: Test configFilePath with committed config fixture
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install GitVersion tool (replaces gitversion/setup)
        run: |
          set -e
          git config --global --add safe.directory '*'
          DOTNET_DIR="$HOME/.dotnet"
          curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel 10.0 --install-dir "$DOTNET_DIR"
          export DOTNET_ROOT="$DOTNET_DIR"
          export DOTNET_ROLL_FORWARD=Major
          export DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1
          export DOTNET_CLI_TELEMETRY_OPTOUT=1
          "$DOTNET_DIR/dotnet" tool install GitVersion.Tool --tool-path "$HOME/gitversion-tool"
          {
            echo "DOTNET_ROOT=$DOTNET_DIR"
            echo "DOTNET_ROLL_FORWARD=Major"
            echo "DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1"
            echo "DOTNET_CLI_TELEMETRY_OPTOUT=1"
            echo "GITVERSION_PATH=$HOME/gitversion-tool"
          } >> "$GITHUB_ENV"
          echo "$DOTNET_DIR" >> "$GITHUB_PATH"
          echo "$HOME/gitversion-tool" >> "$GITHUB_PATH"
      - name: Create an untagged repository (main + act-harness branched from it)
        run: |
          set -e
          REPO="$RUNNER_TEMP/config-repo"
          REMOTE="$RUNNER_TEMP/config-remote.git"
          rm -rf "$REPO" "$REMOTE"
          git init -q --bare "$REMOTE"
          mkdir -p "$REPO"
          cd "$REPO"
          # act-harness must have a source branch (main) or GitVersion treats it as orphaned
          git init -q -b main
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo hello > README.md
          git add README.md
          git commit -q -m "initial"
          git checkout -q -b act-harness
          echo world >> README.md
          git commit -q -am "second"
          git remote add origin "$REMOTE"
          git push -q origin main act-harness
          git fetch -q origin
          git branch -u origin/act-harness
          git log --oneline --decorate --all
          test -f "$GITHUB_WORKSPACE/tests/fixtures/GitVersion.yml"
      - id: action
        uses: .
        with:
          targetPath: ${{ runner.temp }}/config-repo
          configFilePath: ${{ github.workspace }}/tests/fixtures/GitVersion.yml
      - name: Assert config file next-version applied
        env:
          MAJOR: ${{ steps.action.outputs.major }}
          MINOR: ${{ steps.action.outputs.minor }}
          SEMVER: ${{ steps.action.outputs.semVer }}
        run: |
          echo "major=$MAJOR minor=$MINOR semVer=$SEMVER"
          if [ "$MAJOR" != "42" ] || [ "$MINOR" != "0" ]; then
            echo "FAIL: expected version 42.0.x from config file"; exit 1
          fi
          case "$SEMVER" in
            42.0.*) ;;
            *) echo "FAIL: semVer should start with 42.0."; exit 1 ;;
          esac
          echo "PASS"
