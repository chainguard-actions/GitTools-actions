name: Test missing targetPath fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install GitVersion CLI
        run: bash "$GITHUB_WORKSPACE/tests/fixtures/install-gitversion.sh"
      - id: action
        uses: .
        continue-on-error: true
        with:
          targetPath: this-directory-does-not-exist
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SEMVER: ${{ steps.action.outputs.semVer }}
        run: |
          echo "outcome: $OUTCOME semVer: $SEMVER"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for nonexistent targetPath"
            exit 1
          fi
          [ -z "$SEMVER" ] || { echo "FAIL: no outputs expected"; exit 1; }
          echo "PASS"
