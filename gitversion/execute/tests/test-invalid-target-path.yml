name: Test invalid targetPath fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install GitVersion binary
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/gitversion"
          curl -sSfL -o "$RUNNER_TEMP/gitversion.tar.gz" \
            https://github.com/GitTools/GitVersion/releases/download/6.3.0/gitversion-linux-x64-6.3.0.tar.gz
          tar -xzf "$RUNNER_TEMP/gitversion.tar.gz" -C "$RUNNER_TEMP/gitversion"
          chmod +x "$RUNNER_TEMP/gitversion/gitversion"
          ln -sf "$RUNNER_TEMP/gitversion/gitversion" "$RUNNER_TEMP/gitversion/dotnet-gitversion"
          echo "$RUNNER_TEMP/gitversion" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          targetPath: this-directory-does-not-exist
          disableNormalization: 'true'
          disableShallowCloneCheck: 'true'
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          MMP: ${{ steps.action.outputs.majorMinorPatch }}
        run: |
          echo "outcome=$OUTCOME majorMinorPatch=$MMP"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for nonexistent targetPath"; exit 1
          fi
          echo "PASS"
