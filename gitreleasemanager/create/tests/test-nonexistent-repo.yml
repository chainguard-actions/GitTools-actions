name: Test create release against nonexistent repository fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: actionchain-harness-does-not-exist/no-such-repo-xyz
          token: ${{ github.token }}
          milestone: 0.0.1
          name: 0.0.1
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for nonexistent repository, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed as expected"
