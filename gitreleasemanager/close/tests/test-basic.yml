name: Test basic close milestone
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Try to install GitReleaseManager tool (best effort)
        run: |
          if command -v dotnet >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/grm"
            dotnet tool install GitReleaseManager.Tool --version 0.20.0 --tool-path "$RUNNER_TEMP/grm" || true
            echo "GITRELEASEMANAGER_PATH=$RUNNER_TEMP/grm" >> "$GITHUB_ENV"
            echo "$RUNNER_TEMP/grm" >> "$GITHUB_PATH"
          else
            echo "dotnet not available; action is expected to fail gracefully"
          fi
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: ${{ github.repository }}
          token: ${{ github.token }}
          milestone: '1.0.0'
      - name: Assert action ran (succeeded, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo/milestone is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
