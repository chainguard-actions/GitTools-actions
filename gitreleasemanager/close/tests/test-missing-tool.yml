name: Test close fails when GitReleaseManager is not installed
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure tool is not available
        run: |
          if command -v dotnet-gitreleasemanager >/dev/null 2>&1; then
            echo "dotnet-gitreleasemanager unexpectedly on PATH: $(command -v dotnet-gitreleasemanager)"
          fi
          echo "GITRELEASEMANAGER_PATH=$RUNNER_TEMP/does-not-exist" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: actionchain-harness/this-repo-does-not-exist-12345
          token: ${{ github.token }}
          milestone: v0.0.0-nonexistent
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when the tool is missing, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
