name: Test close fails for nonexistent repository/milestone
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Try to install GitReleaseManager (best effort)
        continue-on-error: true
        run: |
          if command -v dotnet >/dev/null 2>&1; then
            dotnet tool install --global GitReleaseManager.Tool || true
            echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          else
            echo "dotnet not available; action is expected to fail locating the tool"
          fi
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: ${{ github.repository }}
          token: ${{ github.token }}
          milestone: 0.0.0-actionchain-nonexistent
      - name: Assert action failed (repository/milestone cannot be resolved)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected for a nonexistent milestone on the sentinel repo"
          else
            echo "FAIL: expected outcome 'failure' but got '$OUTCOME'"
            exit 1
          fi
