name: Test basic open release
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: GitTools/actions
          token: ${{ secrets.GITHUB_TOKEN }}
          milestone: 'v0.0.0-actionchain-nonexistent'
      - name: Assert action ran (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (tool not set up / no permission on repo / milestone missing)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
