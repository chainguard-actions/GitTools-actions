name: Test open release with targetDirectory and logFilePath
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare target directory
        run: mkdir -p "$GITHUB_WORKSPACE/grm-target"
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: ${{ github.repository }}
          token: ${{ github.token }}
          milestone: '2.0.0'
          targetDirectory: ${{ github.workspace }}/grm-target
          logFilePath: ${{ github.workspace }}/grm-target/grm.log
      - name: Assert action ran (no crash before evaluation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action executed with outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
