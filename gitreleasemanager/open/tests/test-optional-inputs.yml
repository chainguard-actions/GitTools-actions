name: Test optional targetDirectory and logFilePath
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare target directory
        run: mkdir -p "$GITHUB_WORKSPACE/grm-target"
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: GitTools/actions
          token: ${{ secrets.GITHUB_TOKEN }}
          milestone: 'v0.0.0-actionchain-nonexistent'
          targetDirectory: grm-target
          logFilePath: grm-target/grm.log
      - name: Assert action ran (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ -f "$GITHUB_WORKSPACE/grm-target/grm.log" ]; then
            echo "--- log ---"; cat "$GITHUB_WORKSPACE/grm-target/grm.log"
          fi
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
