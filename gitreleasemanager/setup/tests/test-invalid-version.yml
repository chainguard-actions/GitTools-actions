name: Test invalid version spec fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure .NET 8 SDK is available
        run: |
          echo "DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1" >> "$GITHUB_ENV"
          echo "DOTNET_CLI_TELEMETRY_OPTOUT=1" >> "$GITHUB_ENV"
          echo "DOTNET_NOLOGO=1" >> "$GITHUB_ENV"
          if command -v dotnet >/dev/null 2>&1 && dotnet --list-sdks | grep -q '^8\.'; then
            echo "dotnet 8 SDK already present"
            exit 0
          fi
          curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 bash /tmp/dotnet-install.sh --channel 8.0 --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        with:
          versionSpec: '99.99.99'
      - name: Assert action failed for non-existent version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for non-existent version 99.99.99"
            exit 1
          fi
          if command -v dotnet-gitreleasemanager >/dev/null 2>&1; then
            echo "FAIL: tool unexpectedly installed"
            exit 1
          fi
          echo "PASS"
