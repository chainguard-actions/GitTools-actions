name: Test exact version install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install .NET SDK 8.0
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel 8.0 --install-dir "$HOME/.dotnet"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          versionSpec: '0.20.0'
      - name: Assert gitreleasemanager is on PATH
        run: |
          if ! command -v dotnet-gitreleasemanager >/dev/null 2>&1; then
            echo "FAIL: dotnet-gitreleasemanager not found on PATH"
            echo "PATH=$PATH"
            exit 1
          fi
          echo "found: $(command -v dotnet-gitreleasemanager)"
          echo "PASS"
      - name: Assert installed version matches
        run: |
          OUT="$(dotnet-gitreleasemanager --version 2>&1 || true)"
          echo "version output: $OUT"
          if ! echo "$OUT" | grep -q '0\.20\.0'; then
            echo "FAIL: expected version 0.20.0 in output"
            exit 1
          fi
          echo "PASS"
