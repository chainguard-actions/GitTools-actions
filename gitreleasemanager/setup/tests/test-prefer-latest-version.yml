name: Test preferLatestVersion
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure .NET 8 SDK is available
        run: |
          echo "DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1" >> "$GITHUB_ENV"
          echo "DOTNET_CLI_TELEMETRY_OPTOUT=1" >> "$GITHUB_ENV"
          echo "DOTNET_NOLOGO=1" >> "$GITHUB_ENV"
          if command -v dotnet >/dev/null 2>&1 && dotnet --list-sdks | grep -q '^8\.'; then
            echo "dotnet 8 SDK already present"
            exit 0
          fi
          curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 bash /tmp/dotnet-install.sh --channel 8.0 --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
      - id: action
        uses: .
        with:
          versionSpec: '0.20.x'
          preferLatestVersion: 'true'
          includePrerelease: 'false'
      - name: Assert GitReleaseManager is installed
        run: |
          TOOL="$(command -v dotnet-gitreleasemanager || true)"
          echo "tool: $TOOL"
          if [ -z "$TOOL" ]; then
            echo "FAIL: dotnet-gitreleasemanager not found on PATH"
            echo "PATH=$PATH"
            exit 1
          fi
          OUT="$(dotnet-gitreleasemanager --version 2>&1 || true)"
          echo "version output: $OUT"
          if ! echo "$OUT$TOOL" | grep -q '0\.20\.'; then
            echo "FAIL: expected a 0.20.x version"
            exit 1
          fi
          echo "PASS"
