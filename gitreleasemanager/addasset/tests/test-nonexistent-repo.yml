name: Test addasset fails for nonexistent repository
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create asset file
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          echo "hello asset" > "$RUNNER_TEMP/assets/asset.txt"
          echo "ASSET_PATH=$RUNNER_TEMP/assets/asset.txt" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: actionchain-harness-nonexistent/does-not-exist-repo
          token: ${{ secrets.GITHUB_TOKEN }}
          milestone: '9.9.9-does-not-exist'
          assets: ${{ env.ASSET_PATH }}
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for nonexistent repository, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed as expected"
