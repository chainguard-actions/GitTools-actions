name: Test addasset with a nonexistent asset on a nonexistent repo
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: actionchain-harness/does-not-exist-repo
          token: ${{ secrets.GITHUB_TOKEN }}
          milestone: v0.0.0-missing
          assets: /tmp/definitely-not-a-real-asset-file.zip
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for nonexistent asset/repo, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
