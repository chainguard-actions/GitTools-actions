name: Test gitreleasemanager addasset basic
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create asset file
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          echo "hello asset" > "$RUNNER_TEMP/assets/asset.txt"
          echo "ASSET_PATH=$RUNNER_TEMP/assets/asset.txt" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: actionchain-harness/nonexistent-repo
          token: ${{ github.token }}
          milestone: '0.0.1'
          assets: ${{ env.ASSET_PATH }}
      - name: Assert action ran (succeeded or failed gracefully on the nonexistent repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (repo/release not resolvable under harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
