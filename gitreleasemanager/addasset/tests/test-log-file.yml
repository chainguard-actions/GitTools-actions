name: Test addasset with targetDirectory and logFilePath
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create asset file
        run: |
          mkdir -p "$RUNNER_TEMP/grm"
          echo "asset content" > "$RUNNER_TEMP/grm/asset.txt"
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          milestone: v0.0.2-act-test
          assets: ${{ runner.temp }}/grm/asset.txt
          targetDirectory: ${{ runner.temp }}/grm
          logFilePath: ${{ runner.temp }}/grm/grm.log
      - name: Assert action ran (or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ -f "$RUNNER_TEMP/grm/grm.log" ]; then
            echo "log file contents:"; cat "$RUNNER_TEMP/grm/grm.log"
          fi
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: asset added"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo / no release is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
