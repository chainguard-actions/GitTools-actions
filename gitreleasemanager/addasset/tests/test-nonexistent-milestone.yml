name: Test addasset with a nonexistent repository/milestone
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create asset file
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          echo "hello asset" > "$RUNNER_TEMP/assets/asset.txt"
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: actionchain-harness/does-not-exist-repo-xyz
          token: ${{ github.token }}
          milestone: 'nonexistent-milestone-999.999.999'
          assets: ${{ runner.temp }}/assets/asset.txt
      - name: Assert action failed for nonexistent repository
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for nonexistent repository/milestone, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed as expected"
