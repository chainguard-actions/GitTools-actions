name: Test publish with missing required milestone
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: actionchain-harness/nonexistent-repo-for-tests
          token: ${{ github.token }}
      - name: Assert action failed without milestone
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected without a milestone"
          else
            echo "FAIL: expected failure, got '$OUTCOME'"
            exit 1
          fi
