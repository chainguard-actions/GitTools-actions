name: Test publish against nonexistent milestone
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          milestone: 0.0.0-act-harness-nonexistent
      - name: Assert action ran and failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (tool missing or sentinel repo/milestone not resolvable)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: publishing a nonexistent milestone on a sentinel repo should not succeed"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
