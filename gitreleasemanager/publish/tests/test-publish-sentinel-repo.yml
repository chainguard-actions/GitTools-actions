name: Test publish against unresolvable repository
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: ${{ github.repository }}
          token: ${{ github.token }}
          milestone: 0.0.0-actionchain-nonexistent
      - name: Assert action failed (repo/milestone cannot be published)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: publish failed as expected for sentinel repository"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
