name: Test publish against unresolvable repository
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: actionchain-harness/nonexistent-repo-for-tests
          token: ${{ github.token }}
          milestone: 0.0.1-test
      - name: Assert action failed gracefully (repo/milestone cannot exist)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully on the nonexistent repository"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: publishing to a nonexistent repository should not succeed"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
