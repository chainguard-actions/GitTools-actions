name: Test publish with targetDirectory and logFilePath
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare target directory
        run: mkdir -p "$GITHUB_WORKSPACE/grm-target"
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: ${{ github.repository }}
          token: ${{ github.token }}
          milestone: 0.0.0-actionchain-nonexistent
          targetDirectory: ${{ github.workspace }}/grm-target
          logFilePath: ${{ github.workspace }}/grm-target/grm.log
      - name: Assert action failed gracefully (sentinel repo cannot be published)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          ls -la "$GITHUB_WORKSPACE/grm-target" || true
          if [ -f "$GITHUB_WORKSPACE/grm-target/grm.log" ]; then
            echo "--- log ---"
            cat "$GITHUB_WORKSPACE/grm-target/grm.log"
          fi
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: publish failed as expected"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
