name: Test discard against a nonexistent repository
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: actionchain-harness/this-repo-does-not-exist-xyz
          token: ${{ github.token }}
          milestone: 0.0.0-nonexistent-milestone
          targetDirectory: ${{ github.workspace }}
      - name: Assert action ran and failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (repository/milestone not resolvable)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: discarding a release on a nonexistent repository should not succeed"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
