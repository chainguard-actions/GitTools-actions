name: Test discard against a nonexistent repository
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: actionchain-harness/does-not-exist-repo
          token: ${{ secrets.GITHUB_TOKEN }}
          milestone: 0.0.0-nonexistent
      - name: Assert action ran and failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: discard failed for a nonexistent repository/milestone"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: discard unexpectedly succeeded on a nonexistent repository"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
