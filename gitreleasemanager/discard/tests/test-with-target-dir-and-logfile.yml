name: Test discard with targetDirectory and logFilePath
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare target directory
        run: mkdir -p "$RUNNER_TEMP/grm-target"
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: actionchain-harness/this-repo-does-not-exist-12345
          token: ${{ secrets.GITHUB_TOKEN || github.token }}
          milestone: 9.9.9
          targetDirectory: ${{ runner.temp }}/grm-target
          logFilePath: ${{ runner.temp }}/grm-target/grm.log
      - name: Assert action ran and failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ -f "$RUNNER_TEMP/grm-target/grm.log" ]; then
            echo "log file contents:"
            cat "$RUNNER_TEMP/grm-target/grm.log" || true
          fi
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected for a non-existent repository"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
