name: Test basic discard
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Discarding a release is a repo-scoped GitHub API operation; the harness
      # repository is a sentinel and the milestone does not exist, so the step is
      # expected to fail gracefully. It must not be skipped or crash the job.
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: ${{ github.repository }}
          token: ${{ github.token }}
          milestone: 0.0.0-nonexistent-actionchain-test
      - name: Assert action ran (succeeded or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: discard completed"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo / missing tool or milestone)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
